# DoD 模板 · flow_weight=中
# 配对：verification-中.yaml · ddd-gate-中.yaml
# plan_refs：示例 id 对齐 dogfood plan-research-spec-impl（项目可替换）

flow_weight: 中

dod:
  deliverables:
    - 规格或任务追溯摘要
    - 槽位 outputs 齐全
    - plan-progress 已更新
  boundaries:
    - 范围变更已确认（gate_level=confirm 时）
  checklist:
    - id: intent_clear
      required: true
      plan_refs:
        milestone_ids: [m-spec]
        work_item_ids: [wi-research, wi-spec]
    - id: plan_progress_synced
      required: true
      plan_refs:
        milestone_ids: [m-spec, m-impl]
        work_item_ids: [wi-spec, wi-impl]
    - id: handoff_snippet_updated
      required: true
      plan_refs:
        milestone_ids: [m-impl]
        work_item_ids: [wi-impl]
    - id: audit_gates_passed
      required: true
      description: 里程碑 audit_gate 已通过或 N/A
      plan_refs:
        milestone_ids: [m-spec, m-impl]
    - id: identity_constraints_held
      required: true
      description: intent 身份约束仍满足；未满足须 blocker 或废除（见 docs/design/identity-constraints.md）
      plan_refs:
        milestone_ids: [m-spec, m-impl]
        work_item_ids: [wi-spec, wi-impl]
    - id: blocker_evidence_recorded
      required: true
      description: 若曾出现身份类 blocker，清除时须在 plan 留 evidence；从未出现可 N/A（见 identity-constraints.md）
      plan_refs:
        milestone_ids: [m-impl]
        work_item_ids: [wi-impl]
