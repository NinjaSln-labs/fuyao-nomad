# 调研→规格→实现 · 计划示例（dogfood）
#
# 重档 dogfood：docs/product/examples/dogfood-iv-scenario.md（stage-重 · 六阶段 · 三层审计）
# 中档：dogfood-ii-scenario.md · 轻档：dogfood-iii-scenario.md
# 矩阵对照：docs/product/examples/dogfood-matrix-comparison.md

version: "0.1"
roster_id: minimal-research-to-spec
flow_weight: 中

intent: 完成竞品调研、规格定稿与最小实现验证

identity_constraints:
  - id: ic-chain
    phrase: 调研、规格定稿与最小实现
    meaning: 须跑通调研→规格→实现验证链；不得只交文档或只交脚本冒充完成
    enforcement: blocker_if_unmet

traceability:
  domain_concepts:
    - id: dc-landscape
      name: AgentTeamLandscape
      description: 竞品格局与能力对照
      source: docs/research/2026-08-22-agent-team-landscape.md
    - id: dc-capability
      name: CapabilityModel
      description: 八能力域与 P0/P1 边界
      source: docs/product/capability-model.md
    - id: dc-plan-dod
      name: PlanDoDLinkage
      description: 计划里程碑与 DoD checklist 联动
      source: docs/design/traceability-contract.md
  links:
    - domain_concept_id: dc-landscape
      work_item_id: wi-research
    - domain_concept_id: dc-capability
      work_item_id: wi-spec
    - domain_concept_id: dc-plan-dod
      work_item_id: wi-impl

plan:
  goal: 跑通调研→规格→实现链，validate/test 绿灯
  scope: 文档与脚本示例；不含生产部署
  phases:
    - id: p1
      name: 发现与定义
    - id: p2
      name: 实现
  work_items:
    - id: wi-research
      title: 竞品快照
      slot_id: research
      phase_id: p1
      domain_concept_ids: [dc-landscape]
      dod_checklist_ids: [intent_clear]
      territory:
        paths: [docs/research/]
    - id: wi-spec
      title: 规格与 schema
      slot_id: spec
      phase_id: p1
      domain_concept_ids: [dc-capability]
      dod_checklist_ids: [intent_clear, plan_progress_synced]
      territory:
        paths: [docs/product/, docs/design/schemas/]
    - id: wi-impl
      title: 最小实现与测试
      slot_id: spec
      phase_id: p2
      domain_concept_ids: [dc-plan-dod]
      dod_checklist_ids: [plan_progress_synced, handoff_snippet_updated]
      territory:
        paths: [scripts/, tests/]
        description: 实现链落在脚本与测试（示例）
  milestones:
    - id: m-spec
      name: 规格完成
      criteria: north-star 与 capability-model 对齐
      phase_id: p1
      dod_checklist_ids: [intent_clear, plan_progress_synced, audit_gates_passed, identity_constraints_held]
    - id: m-impl
      name: 实现验证
      criteria: npm run validate && npm test
      phase_id: p2
      audit_gate: implementation
      dod_checklist_ids: [plan_progress_synced, handoff_snippet_updated, audit_gates_passed, identity_constraints_held]

progress:
  current_phase_id: p1
  active_slot_id: research
  active_work_item_ids: [wi-research]
  blockers:
    # 示意：曾因身份约束阻塞，取证后 cleared（路径为虚构审计落点）
    - id: blk-ic-chain-example
      description: 曾未跑通调研→规格→实现链
      related_identity_constraint_ids: [ic-chain]
      status: cleared
      cleared_at: "2026-08-26T00:00:00Z"
      evidence:
        path: .agents/audit/example-identity-held.md
        note: 示意证据；真实项目替换为实测/审计路径
  next_actions:
    - action: 完成竞品快照
      slot_id: research
  handoff_snippet: "调研→规格→实现链示例；见 docs/product/examples/research-spec-impl-chain.md"
  messages_dir: .agents/messages/minimal-research-to-spec
  updated_at: "2026-08-23T00:00:00Z"
