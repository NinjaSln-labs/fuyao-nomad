# DoD 模板 · flow_weight=中重
# plan_refs：中重端双向示例（对齐 dogfood 里程碑/工作项 id 时可替换）

flow_weight: 中重

dod:
  deliverables:
    - 规格或任务追溯摘要
    - 槽位 outputs 齐全
    - plan-progress 已更新
    - 关键路径集成说明（若适用）
  boundaries:
    - 范围变更已确认
  checklist:
    - id: intent_clear
      required: true
      plan_refs:
        milestone_ids: [m-spec]
        work_item_ids: [wi-research, wi-spec]
    - id: plan_progress_synced
      required: true
      plan_refs:
        milestone_ids: [m-spec, m-impl]
        work_item_ids: [wi-spec, wi-impl]
    - id: handoff_snippet_updated
      required: true
      plan_refs:
        milestone_ids: [m-impl]
        work_item_ids: [wi-impl]
    - id: integration_risk_addressed
      required: true
      plan_refs:
        milestone_ids: [m-impl]
        work_item_ids: [wi-impl]
    - id: audit_gates_passed
      required: true
      plan_refs:
        milestone_ids: [m-spec, m-impl]
