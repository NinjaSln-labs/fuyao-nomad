# DoD 模板 · flow_weight=重
# plan_refs：重端里程碑+工作项双向（示例 id，项目可替换）

flow_weight: 重

dod:
  deliverables:
    - 完整追溯链（意图→领域→任务→实现）
    - 分层审计记录（design / implementation / code_quality）
    - plan-progress + handoff 产物齐全
  boundaries:
    - ADR 已覆盖硬约束
    - 范围外工作显式排除
  checklist:
    - id: trace_matrix_complete
      required: true
      plan_refs:
        milestone_ids: [m-spec, m-impl]
        work_item_ids: [wi-research, wi-spec, wi-impl]
    - id: design_audit_pass
      required: true
      plan_refs:
        milestone_ids: [m-spec]
        work_item_ids: [wi-spec]
    - id: implementation_audit_pass
      required: true
      plan_refs:
        milestone_ids: [m-impl]
        work_item_ids: [wi-impl]
    - id: code_quality_audit_pass
      required: true
      plan_refs:
        milestone_ids: [m-impl]
        work_item_ids: [wi-impl]
    - id: verifier_signoff
      required: true
      description: verifier 或 auditor 槽位复核
      plan_refs:
        milestone_ids: [m-impl]
        work_item_ids: [wi-impl]
    - id: gate_confirm_resolved
      required: true
      plan_refs:
        milestone_ids: [m-spec, m-impl]
        work_item_ids: [wi-spec, wi-impl]
    - id: identity_constraints_held
      required: true
      description: intent 身份约束仍满足；未满足须 blocker 或废除（见 docs/design/identity-constraints.md）
      plan_refs:
        milestone_ids: [m-spec, m-impl]
        work_item_ids: [wi-spec, wi-impl]
    - id: blocker_evidence_recorded
      required: true
      description: 若曾出现身份类 blocker，清除时须在 plan 留 evidence；从未出现可 N/A（见 identity-constraints.md）
      plan_refs:
        milestone_ids: [m-impl]
        work_item_ids: [wi-impl]
    - id: eval_gates_reviewed
      required: false
      description: 仅当 eval-gates.enabled=true 时须勾选；对照三门与证据（见 docs/design/eval-gates.md）
      plan_refs:
        milestone_ids: [m-impl]
        work_item_ids: [wi-impl]
