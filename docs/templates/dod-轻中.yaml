# DoD 模板 · flow_weight=轻中
# plan_refs：轻中端示例 id（项目可替换）

flow_weight: 轻中

dod:
  deliverables:
    - 意图/范围陈述
    - 约定产出物（按槽位 outputs）
  boundaries:
    - 明确不做什么
  checklist:
    - id: intent_clear
      required: true
      plan_refs:
        milestone_ids: [m-done]
        work_item_ids: [wi-main]
    - id: handoff_snippet_updated
      required: true
      plan_refs:
        milestone_ids: [m-done]
        work_item_ids: [wi-main]
    - id: smoke_verified
      required: true
      description: 变更路径 smoke 或可读性自检
      plan_refs:
        milestone_ids: [m-done]
        work_item_ids: [wi-main]
