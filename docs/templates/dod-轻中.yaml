# DoD 模板 · flow_weight=轻中

flow_weight: 轻中

dod:
  deliverables:
    - 意图/范围陈述
    - 约定产出物（按槽位 outputs）
  boundaries:
    - 明确不做什么
  checklist:
    - id: intent_clear
      required: true
    - id: handoff_snippet_updated
      required: true
    - id: smoke_verified
      required: true
      description: 变更路径 smoke 或可读性自检
