# 配对：dod-重.yaml · ddd-gate-重.yaml

flow_weight: 重

verification:
  coding:
    - id: unit_tests_changed_scope
      required: true
    - id: build_passes
      required: true
    - id: test_passes
      required: true
    - id: integration_tests
      required: true
    - id: second_slot_verifier
      required: true
      description: verifier 槽位复核测试与证据
  non_coding:
    - id: sources_cited
      required: true
    - id: trace_to_intent
      required: true

audit:
  design:
    required: true
    depth: high
    gate: before_implementation
  implementation:
    required: true
    depth: high
  code_quality:
    required: true
    depth: security_and_maintainability
