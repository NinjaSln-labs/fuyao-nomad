# DoD 模板 · flow_weight=全流程
# plan_refs：全流程端端到端双向（示例 id，项目可替换）

flow_weight: 全流程

dod:
  deliverables:
    - 文档齐套（按项目约定结构）
    - 全追溯矩阵与审计留痕
    - 反指标/安全模块（若项目启用）
  boundaries:
    - 全流程门禁项逐项勾选或标注 N/A
  checklist:
    - id: doc_set_complete
      required: true
      plan_refs:
        milestone_ids: [m-spec, m-impl, m-release]
        work_item_ids: [wi-research, wi-spec, wi-impl]
    - id: trace_end_to_end
      required: true
      plan_refs:
        milestone_ids: [m-spec, m-impl, m-release]
        work_item_ids: [wi-research, wi-spec, wi-impl]
    - id: all_audit_gates_pass
      required: true
      plan_refs:
        milestone_ids: [m-spec, m-impl, m-release]
    - id: explicit_authorization_gates
      required: true
      plan_refs:
        milestone_ids: [m-release]
        work_item_ids: [wi-impl]
    - id: optional_modules_declared
      required: true
      description: 对抗/边界/反指标等可选模块是否启用已声明
      plan_refs:
        milestone_ids: [m-release]
        work_item_ids: [wi-impl]
    - id: anti_metrics_reviewed
      required: false
      description: 若启用反指标模块，已按 anti-metrics 模板评审（见 docs/templates/anti-metrics-重.yaml）
      plan_refs:
        milestone_ids: [m-release]
        work_item_ids: [wi-impl]
